[project]
name = "swarm-agentcore-agent"
version = "0.1.0"
description = "Swarm AgentCore: one Deep Agent per workflow category, WebSocket-streamed compliance checking"
requires-python = ">=3.12"
dependencies = [
    # Core Deep Agent framework (Deep Agents = LangChain/LangGraph + built-in middleware)
    "deepagents>=0.5.3",
    "langchain>=1.2.15,<2.0.0",
    "langgraph>=1.0.6",
    "langchain-aws>=0.2.0",
    "langgraph-checkpoint-aws>=1.0.2",

    # AgentCore runtime (BedrockAgentCoreApp with @app.websocket + @app.ping)
    "bedrock-agentcore>=0.1.0",

    # AWS SDK
    "boto3>=1.35.0",

    # HTTP client (used by the show_property_map tool to hit Nominatim)
    "httpx>=0.27.0",

    # Data validation
    "pydantic>=2.9.0",

    # Observability
    "langsmith>=0.1.0",
    "aws-opentelemetry-distro-genai-beta>=0.1.2",
    "opentelemetry-instrumentation",

    # WebSocket support (for local testing)
    "websockets>=12.0",

    # FastAPI + uvicorn (used internally by BedrockAgentCoreApp)
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "bedrock-agentcore-starter-toolkit>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "checkpoint", "middleware", "prompt", "services"]
